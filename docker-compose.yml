services:
  apple-stock-checker:
    build: .
    image: apple-stock-checker:latest
    container_name: apple-stock-checker
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TZ=${TZ:-UTC}
      - PORT=8080
      - DB_PATH=/data/apple-stock.db
      - PUSHOVER_USER_KEY=${PUSHOVER_USER_KEY:-}
      - PUSHOVER_API_TOKEN=${PUSHOVER_API_TOKEN:-}
      - PUSHOVER_DEVICE=${PUSHOVER_DEVICE:-}
    volumes:
      # Unraid persistent appdata mount: /mnt/user/appdata/apple-stock-checker:/data
      - /mnt/user/appdata/apple-stock-checker:/data
